openapi: 3.0.3
info:
  title: STEM API
  version: 1.0.0
  description: Apprentissage guidé étape par étape (chain of thought) pour collégiens
    et lycéens.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Renvoie l'access token ; le refresh token est posé en cookie httpOnly.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Invalide le refresh token (body ou cookie) et supprime le cookie.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Accepte le refresh token dans le body (mobile) ou dans le cookie (web).
        Le nouveau refresh token (rotation) est renvoyé par le même canal.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/curriculum/chapters/:
    get:
      operationId: curriculum_chapters_list
      parameters:
      - in: query
        name: level
        schema:
          type: string
          enum:
          - 1re
          - 2nde
          - 3e
          - 4e
          - 5e
          - 6e
          - Tle
        description: Niveau scolaire
      - in: query
        name: subject
        schema:
          type: string
          enum:
          - anglais
          - francais
          - histoire_geo
          - maths
          - physique_chimie
          - svt
        description: Code de la matière
      tags:
      - curriculum
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chapter'
          description: ''
  /api/curriculum/chapters/{id}/:
    get:
      operationId: curriculum_chapters_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) chapter.
        required: true
      - in: query
        name: level
        schema:
          type: string
          enum:
          - 1re
          - 2nde
          - 3e
          - 4e
          - 5e
          - 6e
          - Tle
        description: Niveau scolaire
      - in: query
        name: subject
        schema:
          type: string
          enum:
          - anglais
          - francais
          - histoire_geo
          - maths
          - physique_chimie
          - svt
        description: Code de la matière
      tags:
      - curriculum
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
          description: ''
  /api/curriculum/subjects/:
    get:
      operationId: curriculum_subjects_list
      tags:
      - curriculum
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subject'
          description: ''
  /api/curriculum/subjects/{code}/:
    get:
      operationId: curriculum_subjects_retrieve
      parameters:
      - in: path
        name: code
        schema:
          enum:
          - maths
          - physique_chimie
          - svt
          - francais
          - anglais
          - histoire_geo
          type: string
          description: |-
            * `maths` - Mathématiques
            * `physique_chimie` - Physique-Chimie
            * `svt` - Sciences de la Vie et de la Terre
            * `francais` - Français
            * `anglais` - Anglais
            * `histoire_geo` - Histoire-Géographie
        required: true
      tags:
      - curriculum
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
          description: ''
  /api/exercises/:
    get:
      operationId: exercises_list
      summary: Mes parcours
      parameters:
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      tags:
      - exercises
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExerciseList'
          description: ''
  /api/exercises/{id}/:
    get:
      operationId: exercises_retrieve
      summary: Parcours sans les réponses attendues
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) exercise.
        required: true
      tags:
      - exercises
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseDetail'
          description: ''
  /api/exercises/{id}/offline/:
    get:
      operationId: exercises_offline_retrieve
      description: 'Inclut les réponses attendues : réservé au propriétaire du parcours,
        jamais aux défis.'
      summary: Parcours complet pour la correction hors-ligne
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) exercise.
        required: true
      tags:
      - exercises
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseOffline'
          description: ''
  /api/extracted-exercises/{id}/:
    patch:
      operationId: extracted_exercises_partial_update
      summary: Corriger un énoncé extrait (matière, niveau, chapitre)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) extracted exercise.
        required: true
      tags:
      - extracted-exercises
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExtractedExercise'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedExtractedExercise'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedExtractedExercise'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractedExercise'
          description: ''
    delete:
      operationId: extracted_exercises_destroy
      summary: Écarter un énoncé extrait non validé
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) extracted exercise.
        required: true
      tags:
      - extracted-exercises
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/extracted-exercises/{id}/generate/:
    post:
      operationId: extracted_exercises_generate_create
      description: Suivre l'avancement via `GET /api/exercises/{id}/`.
      summary: Générer le parcours guidé d'un énoncé validé
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) extracted exercise.
        required: true
      tags:
      - extracted-exercises
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
          description: 'Génération lancée : suivre generation_status.'
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
          description: Parcours existant ou repris du cache.
        '400':
          description: Énoncé non validé ou matière non ouverte.
        '429':
          description: Quota journalier atteint (en-tête Retry-After).
  /api/extracted-exercises/{id}/validate/:
    post:
      operationId: extracted_exercises_validate_create
      description: Le document d'origine est supprimé dès que tous ses énoncés sont
        validés.
      summary: Valider un énoncé extrait
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) extracted exercise.
        required: true
      tags:
      - extracted-exercises
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractedExercise'
          description: ''
        '400':
          description: Matière ou niveau manquant.
  /api/me/:
    get:
      operationId: me_retrieve
      description: Profil de l'élève connecté (niveau, série, pseudo).
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_partial_update
      description: Profil de l'élève connecté (niveau, série, pseudo).
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMe'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMe'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/uploads/:
    post:
      operationId: uploads_create
      description: 'L''extraction est asynchrone : suivre `status` via `GET /api/uploads/{id}/`.'
      summary: Envoyer un document d'exercices
      tags:
      - uploads
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
          description: 'Document déjà envoyé : upload existant.'
        '400':
          description: Fichier refusé (type, taille, pages).
        '429':
          description: Quota journalier atteint (en-tête Retry-After).
  /api/uploads/{id}/:
    get:
      operationId: uploads_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) upload.
        required: true
      tags:
      - uploads
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
          description: ''
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Chapter:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        subject:
          allOf:
          - $ref: '#/components/schemas/SubjectCodeEnum'
          readOnly: true
        level:
          $ref: '#/components/schemas/LevelEnum'
        name:
          type: string
          maxLength: 200
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - id
      - level
      - name
      - subject
    Exercise:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        subject:
          allOf:
          - $ref: '#/components/schemas/SubjectCodeEnum'
          readOnly: true
        chapter:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        level:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          readOnly: true
        exam:
          type: string
          readOnly: true
          description: 'Examen visé : BEPC (collège) ou BAC (lycée).'
        generation_status:
          allOf:
          - $ref: '#/components/schemas/GenerationStatusEnum'
          readOnly: true
        error_message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - chapter
      - created_at
      - error_message
      - exam
      - generation_status
      - id
      - level
      - subject
      - title
    ExerciseDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        subject:
          allOf:
          - $ref: '#/components/schemas/SubjectCodeEnum'
          readOnly: true
        chapter:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        level:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          readOnly: true
        exam:
          type: string
          readOnly: true
          description: 'Examen visé : BEPC (collège) ou BAC (lycée).'
        generation_status:
          allOf:
          - $ref: '#/components/schemas/GenerationStatusEnum'
          readOnly: true
        error_message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        schema_version:
          type: string
          readOnly: true
        content:
          type: object
          additionalProperties: {}
          readOnly: true
          description: 'Parcours (README §6, JSON Schema dans schemas/exercise-content.schema.json)
            sans les champs qui donnent la réponse : activity.answer, common_mistakes,
            explanation, dernier indice. null tant que le parcours n''est pas prêt.'
      required:
      - chapter
      - content
      - created_at
      - error_message
      - exam
      - generation_status
      - id
      - level
      - schema_version
      - subject
      - title
    ExerciseOffline:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        subject:
          allOf:
          - $ref: '#/components/schemas/SubjectCodeEnum'
          readOnly: true
        chapter:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        level:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          readOnly: true
        exam:
          type: string
          readOnly: true
          description: 'Examen visé : BEPC (collège) ou BAC (lycée).'
        generation_status:
          allOf:
          - $ref: '#/components/schemas/GenerationStatusEnum'
          readOnly: true
        error_message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        schema_version:
          type: string
          readOnly: true
        content:
          type: object
          additionalProperties: {}
          readOnly: true
          description: 'Parcours (README §6, JSON Schema dans schemas/exercise-content.schema.json)
            sans les champs qui donnent la réponse : activity.answer, common_mistakes,
            explanation, dernier indice. null tant que le parcours n''est pas prêt.'
      required:
      - chapter
      - content
      - created_at
      - error_message
      - exam
      - generation_status
      - id
      - level
      - schema_version
      - subject
      - title
    ExtractedExercise:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        order:
          type: integer
          readOnly: true
        statement:
          type: string
        subject:
          allOf:
          - $ref: '#/components/schemas/SubjectCodeEnum'
          nullable: true
        chapter:
          type: string
          format: uuid
          nullable: true
        chapter_hint:
          type: string
          readOnly: true
        level:
          oneOf:
          - $ref: '#/components/schemas/LevelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        validated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - chapter_hint
      - id
      - order
      - statement
      - validated_at
    FileTypeEnum:
      enum:
      - image
      - pdf
      type: string
      description: |-
        * `image` - Image
        * `pdf` - PDF
    GenerationStatusEnum:
      enum:
      - pending
      - generating
      - ready
      - needs_review
      - error
      type: string
      description: |-
        * `pending` - En attente
        * `generating` - Génération
        * `ready` - Prêt
        * `needs_review` - À revoir
        * `error` - Erreur
    LevelEnum:
      enum:
      - 6e
      - 5e
      - 4e
      - 3e
      - 2nde
      - 1re
      - Tle
      type: string
      description: |-
        * `6e` - 6e
        * `5e` - 5e
        * `4e` - 4e
        * `3e` - 3e
        * `2nde` - 2nde
        * `1re` - 1re
        * `Tle` - Terminale
    Me:
      type: object
      properties:
        phone:
          type: string
          readOnly: true
        pseudo:
          type: string
          maxLength: 30
        level:
          oneOf:
          - $ref: '#/components/schemas/LevelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        serie:
          type: string
          maxLength: 10
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - phone
      - pseudo
    PaginatedExerciseList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Exercise'
    PatchedExtractedExercise:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        order:
          type: integer
          readOnly: true
        statement:
          type: string
        subject:
          allOf:
          - $ref: '#/components/schemas/SubjectCodeEnum'
          nullable: true
        chapter:
          type: string
          format: uuid
          nullable: true
        chapter_hint:
          type: string
          readOnly: true
        level:
          oneOf:
          - $ref: '#/components/schemas/LevelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        validated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
    PatchedMe:
      type: object
      properties:
        phone:
          type: string
          readOnly: true
        pseudo:
          type: string
          maxLength: 30
        level:
          oneOf:
          - $ref: '#/components/schemas/LevelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        serie:
          type: string
          maxLength: 10
        date_joined:
          type: string
          format: date-time
          readOnly: true
    Register:
      type: object
      description: 'Seule donnée personnelle collectée : le téléphone. `pseudo` est
        un nom d''affichage.'
      properties:
        phone:
          type: string
          maxLength: 25
        pseudo:
          type: string
          maxLength: 30
        password:
          type: string
          writeOnly: true
        level:
          $ref: '#/components/schemas/LevelEnum'
        serie:
          type: string
          maxLength: 10
      required:
      - level
      - password
      - phone
      - pseudo
    StatusEnum:
      enum:
      - pending
      - reading
      - extracted
      - error
      type: string
      description: |-
        * `pending` - En attente
        * `reading` - Lecture en cours
        * `extracted` - Énoncés extraits
        * `error` - Erreur
    Subject:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/SubjectCodeEnum'
        name:
          type: string
          maxLength: 100
      required:
      - code
      - name
    SubjectCodeEnum:
      enum:
      - maths
      - physique_chimie
      - svt
      - francais
      - anglais
      - histoire_geo
      type: string
      description: |-
        * `maths` - Mathématiques
        * `physique_chimie` - Physique-Chimie
        * `svt` - Sciences de la Vie et de la Terre
        * `francais` - Français
        * `anglais` - Anglais
        * `histoire_geo` - Histoire-Géographie
    TokenObtainPair:
      type: object
      properties:
        phone:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - phone
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    Upload:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        file_type:
          allOf:
          - $ref: '#/components/schemas/FileTypeEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        error_message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/ExtractedExercise'
          readOnly: true
      required:
      - created_at
      - error_message
      - exercises
      - file_type
      - id
      - status
    UploadCreate:
      type: object
      properties:
        file:
          type: string
          format: uri
          description: Photo (JPEG, PNG, WebP) ou PDF.
      required:
      - file
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
