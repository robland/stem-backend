openapi: 3.0.3
info:
  title: STEM API
  version: 1.0.0
  description: Apprentissage guidé étape par étape (chain of thought) pour collégiens
    et lycéens.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Renvoie l'access token ; le refresh token est posé en cookie httpOnly.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Invalide le refresh token (body ou cookie) et supprime le cookie.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Accepte le refresh token dans le body (mobile) ou dans le cookie (web).
        Le nouveau refresh token (rotation) est renvoyé par le même canal.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/curriculum/chapters/:
    get:
      operationId: curriculum_chapters_list
      parameters:
      - in: query
        name: level
        schema:
          type: string
          enum:
          - 1re
          - 2nde
          - 3e
          - 4e
          - 5e
          - 6e
          - Tle
        description: Niveau scolaire
      - in: query
        name: subject
        schema:
          type: string
          enum:
          - anglais
          - francais
          - histoire_geo
          - maths
          - physique_chimie
          - svt
        description: Code de la matière
      tags:
      - curriculum
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chapter'
          description: ''
  /api/curriculum/chapters/{id}/:
    get:
      operationId: curriculum_chapters_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) chapter.
        required: true
      - in: query
        name: level
        schema:
          type: string
          enum:
          - 1re
          - 2nde
          - 3e
          - 4e
          - 5e
          - 6e
          - Tle
        description: Niveau scolaire
      - in: query
        name: subject
        schema:
          type: string
          enum:
          - anglais
          - francais
          - histoire_geo
          - maths
          - physique_chimie
          - svt
        description: Code de la matière
      tags:
      - curriculum
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
          description: ''
  /api/curriculum/subjects/:
    get:
      operationId: curriculum_subjects_list
      tags:
      - curriculum
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subject'
          description: ''
  /api/curriculum/subjects/{code}/:
    get:
      operationId: curriculum_subjects_retrieve
      parameters:
      - in: path
        name: code
        schema:
          enum:
          - maths
          - physique_chimie
          - svt
          - francais
          - anglais
          - histoire_geo
          type: string
          description: |-
            * `maths` - Mathématiques
            * `physique_chimie` - Physique-Chimie
            * `svt` - Sciences de la Vie et de la Terre
            * `francais` - Français
            * `anglais` - Anglais
            * `histoire_geo` - Histoire-Géographie
        required: true
      tags:
      - curriculum
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
          description: ''
  /api/me/:
    get:
      operationId: me_retrieve
      description: Profil de l'élève connecté (niveau, série, pseudo).
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_partial_update
      description: Profil de l'élève connecté (niveau, série, pseudo).
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMe'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMe'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMe'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Chapter:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        subject:
          allOf:
          - $ref: '#/components/schemas/SubjectCodeEnum'
          readOnly: true
        level:
          $ref: '#/components/schemas/LevelEnum'
        name:
          type: string
          maxLength: 200
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - id
      - level
      - name
      - subject
    LevelEnum:
      enum:
      - 6e
      - 5e
      - 4e
      - 3e
      - 2nde
      - 1re
      - Tle
      type: string
      description: |-
        * `6e` - 6e
        * `5e` - 5e
        * `4e` - 4e
        * `3e` - 3e
        * `2nde` - 2nde
        * `1re` - 1re
        * `Tle` - Terminale
    Me:
      type: object
      properties:
        phone:
          type: string
          readOnly: true
        pseudo:
          type: string
          maxLength: 30
        level:
          oneOf:
          - $ref: '#/components/schemas/LevelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        serie:
          type: string
          maxLength: 10
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - phone
      - pseudo
    PatchedMe:
      type: object
      properties:
        phone:
          type: string
          readOnly: true
        pseudo:
          type: string
          maxLength: 30
        level:
          oneOf:
          - $ref: '#/components/schemas/LevelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        serie:
          type: string
          maxLength: 10
        date_joined:
          type: string
          format: date-time
          readOnly: true
    Register:
      type: object
      description: 'Seule donnée personnelle collectée : le téléphone. `pseudo` est
        un nom d''affichage.'
      properties:
        phone:
          type: string
          maxLength: 25
        pseudo:
          type: string
          maxLength: 30
        password:
          type: string
          writeOnly: true
        level:
          $ref: '#/components/schemas/LevelEnum'
        serie:
          type: string
          maxLength: 10
      required:
      - level
      - password
      - phone
      - pseudo
    Subject:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/SubjectCodeEnum'
        name:
          type: string
          maxLength: 100
      required:
      - code
      - name
    SubjectCodeEnum:
      enum:
      - maths
      - physique_chimie
      - svt
      - francais
      - anglais
      - histoire_geo
      type: string
      description: |-
        * `maths` - Mathématiques
        * `physique_chimie` - Physique-Chimie
        * `svt` - Sciences de la Vie et de la Terre
        * `francais` - Français
        * `anglais` - Anglais
        * `histoire_geo` - Histoire-Géographie
    TokenObtainPair:
      type: object
      properties:
        phone:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - phone
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
