# Environnement de développement : API + worker Celery + PostgreSQL + Redis.
#   docker compose up --build
#   docker compose run --rm web pytest
name: stemlearning

x-backend: &backend
  build:
    context: .
    target: dev
  env_file:
    - path: .env
      required: false
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DATABASE_URL: postgres://stem:stem@db:5432/stem
    TEST_DATABASE_URL: postgres://stem:stem@db:5432/stem_test
    CELERY_BROKER_URL: redis://redis:6379/0
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A config worker -l info

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stem
      POSTGRES_USER: stem
      POSTGRES_PASSWORD: stem
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stem -d stem"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
