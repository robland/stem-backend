services:
  - type: web
    name: stem-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/schema/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: WEB_CONCURRENCY
        value: 2
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: stem-redis
          property: connectionString

  # Sans worker, l'analyse des exercices n'est jamais exécutée.
  # Les background workers Render ne sont pas disponibles en plan gratuit :
  # décommenter après avoir choisi un plan payant.
  # - type: worker
  #   name: stem-worker
  #   runtime: docker
  #   plan: starter
  #   dockerfilePath: ./Dockerfile
  #   dockerContext: .
  #   dockerCommand: celery -A config worker -l info --concurrency 2
  #   envVars:
  #     - fromGroup: ...

  # Tâches périodiques sans processus beat : relance des traitements bloqués et purge
  # des fichiers expirés. Les cron jobs Render sont payants (facturés à l'exécution).
  # - type: cron
  #   name: stem-maintenance
  #   runtime: docker
  #   schedule: "*/10 * * * *"
  #   dockerfilePath: ./Dockerfile
  #   dockerContext: .
  #   dockerCommand: python manage.py run_maintenance
  #   envVars:
  #     - fromGroup: ...

  - type: keyvalue
    name: stem-redis
    plan: free
    ipAllowList: []
